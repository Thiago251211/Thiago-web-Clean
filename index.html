<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Salchis App PRO</title>

<style>
body{background:#121212;color:white;font-family:sans-serif;margin:0;}
header{background:#1f1f1f;padding:10px;}
button{background:#ff9800;border:none;padding:6px 10px;margin:3px;border-radius:6px;}
.card{background:#1f1f1f;margin:10px;padding:10px;border-radius:10px;}
.match{display:flex;justify-content:space-between;background:#2a2a2a;padding:8px;margin:5px;border-radius:8px;}
.tabs button{background:#333;}
#panel{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:9999;
}

/* 🔥 ANIMACIONES PRO */

.card{
transition:
transform .5s ease,
background .3s ease,
box-shadow .3s ease;
}

.card{
transform-origin: center;
overflow: hidden;
}

.card:hover{
transform: scale(1.02);
box-shadow: 0 0 10px rgba(0,0,0,0.6);
}

@media (hover: none){
.card:hover{
transform:none;
box-shadow:none;
}
}

.match{
transition: all 0.2s ease;
}

.match:hover{
background:#333;
transform: scale(1.03);
}

button{
transition: all 0.2s ease;
}

button:hover{
transform: scale(1.05);
background:#ffa726;
}

#app{
position:relative;
z-index:1;
}

.rankingCard{
transition: transform .8s ease;
}

.rankingCard:hover{
transform:scale(1.02);

</style>

</head>

function renderGruposTabla(t){

let html = "";

t.grupos.forEach((grupo, gi)=>{

let tabla = {};

// init
grupo.forEach(id=>{
tabla[id]={
pts:0,pj:0,g:0,e:0,p:0,gf:0,gc:0,dg:0
};
});

// calcular
t.jornadas.forEach(j=>{
j.forEach(p=>{

let id1 = p.c1 ?? p.a;
let id2 = p.c2 ?? p.b;

if(!grupo.includes(id1) || !grupo.includes(id2)) return;
if(p.g1 == null) return;

let A = tabla[id1];
let B = tabla[id2];

A.pj++; B.pj++;

A.gf+=p.g1; A.gc+=p.g2;
B.gf+=p.g2; B.gc+=p.g1;

if(p.g1>p.g2){A.pts+=3;A.g++;B.p++;}
else if(p.g2>p.g1){B.pts+=3;B.g++;A.p++;}
else{A.pts+=1;B.pts+=1;A.e++;B.e++;}

});
});

// dg
Object.values(tabla).forEach(t=>t.dg = t.gf - t.gc);

// ordenar
let orden = Object.entries(tabla).sort((a,b)=>{
if(b[1].pts!=a[1].pts) return b[1].pts-a[1].pts;
return b[1].dg-a[1].dg;
});

// render
html += `
<div class="card">
<h3>Grupo ${gi+1}</h3>

<table style="width:100%;text-align:center;">
<tr>
<th>#</th><th>Club</th><th>PTS</th><th>DG</th>
</tr>

${orden.map((e,i)=>`
<tr>
<td>${i+1}</td>
<td>${clubNombre(e[0])}</td>
<td>${e[1].pts}</td>
<td>${e[1].dg}</td>
</tr>
`).join("")}

</table>
</div>
`;

});

return html;
}

// ===== CAMPEÓN =====
function obtenerCampeon(){
let tabla = generarTabla();
if(tabla.length == 0) return null;

let t = torneos[torneoActual];

let completo = true;

t.jornadas.forEach(j=>{
j.forEach(p=>{
if(p.g1 == null) completo = false;
});
});

if(!completo) return null;

return clubNombre(tabla[0][0]);
}

g:0,
e:0,
p:0,
gf:0,
gc:0,
titulos:0,
fifa:1000
});

guardar();
ir("clubes");

};

lector.readAsDataURL(archivo);

clubes.push({
id: Date.now(),
nombre: document.getElementById("nC").value || "Club",

function generarPartidosGrupos(){

let t = torneos[torneoActual];

if(!t.grupos || t.grupos.length === 0){
aviso("No hay grupos");
return;

let jornadas = [];

// por cada grupo
t.grupos.forEach(grupo => {

let partidos = [];

// generar partidos del grupo
let cruces = t.cruces || 1;

for(let i=0;i<grupo.length;i++){
  for(let j=i+1;j<grupo.length;j++){

    for(let c=0;c<cruces;c++){

      if(c % 2 == 0){
        // ida
        partidos.push({
          c1: grupo[i],
          c2: grupo[j],
          g1:null,
          g2:null
        });
      }else{
        // vuelta
        partidos.push({
          c1: grupo[j],
          c2: grupo[i],
          g1:null,
          g2:null
        });
      }

    }

  }
}

// repartir partidos en jornadas
partidos.forEach((p,index)=>{
if(!jornadas[index]) jornadas[index] = [];
jornadas[index].push(p);
});

});

t.jornadas = jornadas;
t.jornadaActual = 0;

cerrarPanel();
guardar();
render();

aviso("Fixture de grupos generado ⚽🔥");
}

// ===== FIXTURE =====
function generarJornadas(){

let t=torneos[torneoActual];
let equipos=[...t.clubes];
let cruces=t.cruces||1;

if(equipos.length%2!==0)equipos.push(null);

let n=equipos.length;
let rot=equipos.slice(1);

let jornadas=[];

for(let c=0;c<cruces;c++){
let local=equipos[0];
let arr=[local,...rot];

for(let j=0;j<n-1;j++){
let jornada=[];

for(let i=0;i<n/2;i++){
let a=arr[i],b=arr[n-1-i];

if(a!=null && b!=null){
if(c%2==0)jornada.push({c1:a,c2:b});
else jornada.push({c1:b,c2:a});
}
}

jornadas.push(jornada);

// rotación
let ult=rot.pop();
rot.unshift(ult);
arr=[local,...rot];
}
}

t.jornadas=jornadas;
t.jornadaActual=0;

guardar();
render();
}

function simularJornada(){

let t = torneos[torneoActual];

// 🔥 guardar ranking ANTES de jugar
localStorage.setItem("rankingPrevio", JSON.stringify(
[...clubes].sort((a,b)=>b.fifa - a.fifa)
));


if(t.jornadaActual === undefined){
t.jornadaActual = 0;
}

let jornada = t.jornadas[t.jornadaActual];
if(!jornada) return;

jornada.forEach(p=>{

let id1 = p.c1 ?? p.a;
let id2 = p.c2 ?? p.b;

let A = clubes[id1];
let B = clubes[id2];

// 🆚 HISTORIAL ENFRENTAMIENTOS

if(!A.vs) A.vs = {};
if(!B.vs) B.vs = {};

if(!A.vs[id2]){
A.vs[id2] = {g:0,e:0,p:0};
}
if(!B.vs[id1]){
B.vs[id1] = {g:0,e:0,p:0};
}

if(!A.nivel) A.nivel = 50;
if(!B.nivel) B.nivel = 50;

let diff = A.nivel - B.nivel;

// base aleatoria
let g1 = Math.floor(Math.random()*3 + diff/20);
let g2 = Math.floor(Math.random()*3 - diff/20);

// asegurar no negativos
g1 = Math.max(0, g1);
g2 = Math.max(0, g2);

p.g1 = g1;
p.g2 = g2;

A.pj++; B.pj++;

A.gf += g1; A.gc += g2;
B.gf += g2; B.gc += g1;
if(g1 > g2){
A.g++; 
B.p++;

A.vs[id2].g++;
B.vs[id1].p++;

A.fifa += 25;
B.fifa -= 15;

}
else if(g2 > g1){
B.g++; 
A.p++;

B.vs[id1].g++;
A.vs[id2].p++;

B.fifa += 25;
A.fifa -= 15;

}
else{
A.e++; 
B.e++;

A.vs[id2].e++;
B.vs[id1].e++;

A.fifa += 10;
B.fifa += 10;
}

// 📈 EVOLUCIÓN DE CLUBES (modo GOD)
if(g1 > g2) A.nivel += 0.2;
if(g2 > g1) B.nivel += 0.2;

// límites
A.nivel = Math.min(100, A.nivel);
B.nivel = Math.min(100, B.nivel);
// ⭐ SISTEMA FIFA GOD
if(g1 > g2){
A.fifa += 10;
B.fifa -= 5;
}
else if(g2 > g1){
B.fifa += 10;
A.fifa -= 5;
}
else{
A.fifa += 2;
B.fifa += 2;
}

// límites
A.fifa = Math.max(0, A.fifa);
B.fifa = Math.max(0, B.fifa);

});

// 🏆 detectar campeón
let total = t.jornadas.length;

if(t.jornadaActual >= total-1){

t.jornadaActual = total-1;

// 🔥 SI ES MUNDIAL → generar eliminatoria
if(t.formato == "Mundial"){

generarEliminatoriaDesdeGrupos();
return;

}

// 🏆 SI ES LIGA → campeón normal
let tabla = generarTabla();
let ganador = tabla[0][0];

if(!clubes[ganador].historial){
clubes[ganador].historial = [];
}

if(t.formato == "Liga"){
clubes[ganador].historial.push({
torneo: t.nombre,
tipo: "liga",
pts: tabla[0][1].pts,
segundo: clubNombre(tabla[1][0])
});
}

if(clubes[ganador]) clubes[ganador].titulos++;

mostrarCampeon(ganador);

guardar();
render();
return;
}

// avanzar jornada
t.jornadaActual++;

guardar();
render();
}

function recalcularTodo(){

// RESET CLUBES
clubes.forEach(c=>{

c.pj = 0;
c.g = 0;
c.e = 0;
c.p = 0;

c.gf = 0;
c.gc = 0;

c.fifa = 1000;

c.titulos = 0;

c.vs = {};

});

// RECORRER TORNEOS
torneos.forEach(t=>{

// LIGA / MUNDIAL
if(t.jornadas){

t.jornadas.forEach(j=>{

j.forEach(p=>{

if(p.g1 == null || p.g2 == null) return;

let A = clubes[p.c1];
let B = clubes[p.c2];

if(!A || !B) return;

// stats
A.pj++;
B.pj++;

A.gf += p.g1;
A.gc += p.g2;

B.gf += p.g2;
B.gc += p.g1;

// vs
if(!A.vs[p.c2]){
A.vs[p.c2] = {g:0,e:0,p:0};
}

if(!B.vs[p.c1]){
B.vs[p.c1] = {g:0,e:0,p:0};
}

// RESULTADO
if(p.g1 > p.g2){

A.g++;
B.p++;

A.fifa += 30;
B.fifa -= 15;

A.vs[p.c2].g++;
B.vs[p.c1].p++;

}
else if(p.g2 > p.g1){

B.g++;
A.p++;

B.fifa += 30;
A.fifa -= 15;

B.vs[p.c1].g++;
A.vs[p.c2].p++;

}
else{

A.e++;
B.e++;

A.fifa += 10;
B.fifa += 10;

A.vs[p.c2].e++;
B.vs[p.c1].e++;

}

A.fifa = Math.max(0,A.fifa);
B.fifa = Math.max(0,B.fifa);

});

});

}

// ELIMINATORIAS
if(t.eliminatorias){

t.eliminatorias.forEach(ronda=>{

ronda.forEach(p=>{

if(p.g1 == null || p.g2 == null) return;

let A = clubes[p.c1];
let B = clubes[p.c2];

if(!A || !B) return;

if(p.g1 > p.g2){

A.fifa += 25;
B.fifa -= 10;

}
else if(p.g2 > p.g1){

B.fifa += 25;
A.fifa -= 10;

}

A.fifa = Math.max(0,A.fifa);
B.fifa = Math.max(0,B.fifa);

});

});

}

// CAMPEÓN LIGA
if(t.formato == "Liga" && t.jornadas?.length){

let completo = true;

t.jornadas.forEach(j=>{
j.forEach(p=>{
if(p.g1 == null) completo = false;
});
});

if(completo){

let tabla = {};

t.clubes.forEach(id=>{
tabla[id] = {
pts:0,
dg:0
};
});

t.jornadas.forEach(j=>{
j.forEach(p=>{

if(p.g1 > p.g2){
tabla[p.c1].pts += 3;
}
else if(p.g2 > p.g1){
tabla[p.c2].pts += 3;
}
else{
tabla[p.c1].pts += 1;
tabla[p.c2].pts += 1;
}

tabla[p.c1].dg += p.g1-p.g2;
tabla[p.c2].dg += p.g2-p.g1;

});
});

let orden = Object.entries(tabla).sort((a,b)=>{
if(b[1].pts != a[1].pts){
return b[1].pts - a[1].pts;
}

return b[1].dg - a[1].dg;
});

let campeon = orden[0]?.[0];

if(!clubes[campeon].historial){
clubes[campeon].historial = [];
}

// evitar duplicados
let existe = clubes[campeon].historial.some(h =>
h.torneo == t.nombre
);

if(!existe){

clubes[campeon].historial.push({
torneo: t.nombre,
tipo: "liga"
});

}

clubes[campeon].fifa += 100;

}

}

});

guardar();

}

function clasificadosAGrupos(){

dg:0,
gf:0
};
});

// recorrer partidos
t.jornadas.forEach(j=>{

let id2 = p.c2 ?? p.b;

if(p.g1 == null) return;

let B = tabla[id2];

A.gf += p.g1;
B.gf += p.g2;

A.dg += (p.g1 - p.g2);
B.dg += (p.g2 - p.g1);

if(p.g1 > p.g2){
A.pts += 3;
}else if(p.g2 > p.g1){
B.pts += 3;
}else{
A.pts += 1;
B.pts += 1;
}

});
});

// ordenar grupo
let ordenados = Object.entries(tabla)
.sort((a,b)=>{
if(b[1].pts != a[1].pts) return b[1].pts - a[1].pts;
if(b[1].dg != a[1].dg) return b[1].dg - a[1].dg;
return b[1].gf - a[1].gf;
});

// agarrar clasificados
let pasan = t.ascensos || 2;

for(let i=0;i<pasan;i++){
if(ordenados[i]){
clasificados.push(ordenados[i][0]);
}
}

});

return clasificados;
}

function siguienteRonda(){
let t=torneos[torneoActual];

// seguridad total
if(!t.eliminatorias || t.eliminatorias.length===0){
return;
}

if(t.rondaActual===undefined){
t.rondaActual=0;
}

let ronda=t.eliminatorias[t.rondaActual];
if(!ronda) return;

let ganadores=[];

for(let p of ronda){

// 🚫 NO avanzar si faltan partidos
if(p.g1==null || p.g2==null){
return;
}

if(p.g1 > p.g2) ganadores.push(p.c1);
else ganadores.push(p.c2);
}

// 🚫 evitar repetir campeón infinito
if(t.terminado){
return;
}

// 🏆 SOLO si hay 1 ganador real
if(ganadores.length === 1){

let campeon = ganadores[0];
let final = ronda[0];

// detectar subcampeón
let sub = final.c1 == campeon ? final.c2 : final.c1;

// crear historial si no existe
if(!clubes[campeon].historial){
clubes[campeon].historial = [];
}

// guardar datos completos
clubes[campeon].historial.push({
torneo: t.nombre,
tipo: "elim",
rival: clubNombre(sub),
resultado: final.g1 + "-" + final.g2
});

// sumar título
clubes[campeon].titulos++;

t.terminado = true;

mostrarCampeon(campeon);

guardar();
render();
return;
}

// generar siguiente ronda
let nueva=[];
for(let i=0;i<ganadores.length;i+=2){
if(ganadores[i+1]!==undefined){
let cruces = t.crucesElim || 1;

// final única
if(
t.finalUnica &&
ganadores.length == 2
){
cruces = 1;
}

for(let c=0;c<cruces;c++){

nueva.push({
c1:ganadores[i],
c2:ganadores[i+1],
g1:null,
g2:null
});

}
}
}

if(nueva.length>0){
t.eliminatorias.push(nueva);
t.rondaActual++;
}

guardar();
render();
}

function guardarResultadoElim(){

let t = torneos[torneoActual];

let {rondaIndex, partidoIndex} = partidoActual;

let p = t.eliminatorias[rondaIndex][partidoIndex];

// 🔥 usar marcador GOD
let g1 = marcadorTemp.a;
let g2 = marcadorTemp.b;

// 🚫 no permitir empate en eliminatoria
if(g1 == g2){
aviso("No puede haber empate en eliminatoria");
return;
}

p.g1 = g1;
p.g2 = g2;

// 🔥 ranking previo
localStorage.setItem("rankingPrevio", JSON.stringify(
[...clubes].sort((a,b)=>b.fifa-a.fifa)
));

let A = clubes[p.c1];
let B = clubes[p.c2];

// ⭐ FIFA
if(g1 > g2){
A.fifa += 20;
B.fifa -= 10;
}else{
B.fifa += 20;
A.fifa -= 10;
}

A.fifa = Math.max(0,A.fifa);
B.fifa = Math.max(0,B.fifa);

guardar();

cerrarPanel();

recalcularTodo();

render();

aviso("Resultado guardado ⚽🔥");
}

function animarNumero(id, nuevoValor){

let cont = document.getElementById(id);
if(!cont) return;

// valor actual
let viejo = cont.innerText;

// contenedor temporal
let wrapper = document.createElement("div");
wrapper.style.position = "relative";
wrapper.style.height = "40px";
wrapper.style.overflow = "hidden";

// viejo número
let viejoDiv = document.createElement("div");
viejoDiv.innerText = viejo;
viejoDiv.style.position = "absolute";
viejoDiv.style.width = "100%";
viejoDiv.style.transition = "0.3s";
viejoDiv.style.transform = "translateY(0)";
viejoDiv.style.opacity = "1";

// nuevo número
let nuevoDiv = document.createElement("div");
nuevoDiv.innerText = nuevoValor;
nuevoDiv.style.position = "absolute";
nuevoDiv.style.width = "100%";
nuevoDiv.style.transform = "translateY(100%)";
nuevoDiv.style.opacity = "0";
nuevoDiv.style.transition = "0.3s";

// limpiar y meter wrapper
cont.innerHTML = "";
cont.appendChild(wrapper);

wrapper.appendChild(viejoDiv);
wrapper.appendChild(nuevoDiv);

// animación
setTimeout(()=>{
viejoDiv.style.transform = "translateY(-100%)";
viejoDiv.style.opacity = "0";

nuevoDiv.style.transform = "translateY(0)";
nuevoDiv.style.opacity = "1";
},10);

// dejar solo el nuevo
setTimeout(()=>{
cont.innerText = nuevoValor;
},300);
}

render();

</script>
